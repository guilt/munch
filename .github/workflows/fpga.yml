name: FPGA Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tang-nano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Build Tang Nano 9K bitstream
        run: |
          cd boards/tangnano9k
          make
          ls -la blinky-tangnano9k.fs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-tangnano9k
          path: boards/tangnano9k/blinky-tangnano9k.fs
          if-no-files-found: error

  arty-s7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Yosys synth for Arty S7
        run: |
          cd boards/arty-s7
          make
          ls -la blinky-arty-s7.*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-arty-s7
          path: boards/arty-s7/blinky-arty-s7.*
          if-no-files-found: warn

  nexys2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Yosys synth for Nexys 2
        run: |
          cd boards/nexys2
          make
          ls -la blinky-nexys2.edif
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-nexys2
          path: boards/nexys2/blinky-nexys2.edif
          if-no-files-found: warn

  superstation-yosys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Yosys synth_intel_alm for SuperStation / Cyclone V
        run: |
          cd boards/mister
          make
          ls -la blinky-superstation.vqm
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-superstation
          path: boards/mister/blinky-superstation.vqm
          if-no-files-found: warn

  superstation-quartus:
    runs-on: ubuntu-latest
    container: raetro/quartus:mister
    steps:
      - uses: actions/checkout@v4
      - name: Attempt SuperStation / Cyclone V compile
        run: |
          cd boards/mister
          # Expect VQM already or generate; Quartus step is best-effort
          make || true
          # Simple Quartus invocation if tools present (image-specific)
          quartus_map --version || echo "Quartus not fully available in this image"
          find . -name "*.sof" -o -name "*.rbf" -o -name "*.vqm" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinky-superstation-quartus
          path: boards/mister/**/*.{sof,rbf,rpt,vqm}
          if-no-files-found: warn

  release:
    needs: [tang-nano, arty-s7, nexys2, superstation-yosys, superstation-quartus]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Flatten for clean release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
