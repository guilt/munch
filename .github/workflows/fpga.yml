name: FPGA Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tang-nano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (Yosys + nextpnr + Apicula)
        uses: YosysHQ/setup-oss-cad-suite@v4

      - name: Build Tang Nano 9K bitstream
        run: |
          cd boards/tangnano9k
          make
          ls -la blinky-tangnano9k.fs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-tangnano9k
          path: boards/tangnano9k/blinky-tangnano9k.fs
          if-no-files-found: error

  yosys-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4

      - name: Yosys experimental synth (Spartan-3E / Series-7)
        run: |
          mkdir -p build
          # Nexys 2 / Spartan-3E — experimental family
          yosys -p "read_verilog src/blinky.v; synth_xilinx -family xc3se -top blinky; write_edif build/blinky-nexys2.edif" || echo "xc3se synth failed" > build/nexys2-note.txt
          # Arty S7 / Series-7 — synthesis only (full .bit needs openXC7 PnR)
          yosys -p "read_verilog src/blinky.v; synth_xilinx -family xc7 -top blinky; write_json build/blinky-arty-s7.json" || echo "xc7 synth failed" > build/arty-note.txt
          echo "See FLASH.md — these are Yosys intermediates, not final bitstreams." > build/README.txt
          ls -la build/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yosys-intermediates
          path: build/
          if-no-files-found: warn

  release:
    needs: [tang-nano, yosys-experimental]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten for clean release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
