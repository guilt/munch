name: FPGA Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tang-nano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Build Tang Nano 9K bitstream
        run: |
          cd boards/tangnano-9k
          make bit
          ls -la blinky-tangnano-9k.fs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-tangnano-9k
          path: boards/tangnano-9k/blinky-tangnano-9k.fs
          if-no-files-found: error

  tang-nano-20k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Build Tang Nano 20K bitstream
        run: |
          cd boards/tangnano-20k
          make bit
          ls -la blinky-tangnano-20k.fs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-tangnano-20k
          path: boards/tangnano-20k/blinky-tangnano-20k.fs
          if-no-files-found: error


  arty-a7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Install full openXC7 toolchain (includes Kintex chipdbs)
        run: |
          curl -L -o /tmp/openxc7.tgz https://github.com/cavearr/toolchain-openxc7-releases/releases/download/2026-10-19/openxc7-toolchain-linux-x86-64-20261019.tgz
          sudo mkdir -p /opt/openxc7
          sudo tar xzf /tmp/openxc7.tgz -C /opt/openxc7 --strip-components=1
          echo "/opt/openxc7/bin" >> $GITHUB_PATH
          echo "NEXTPNR_XILINX_DIR=/opt/openxc7" >> $GITHUB_ENV
          ls /opt/openxc7/share/nextpnr/himbaechel/xilinx/ | head -20 || true
          /opt/openxc7/bin/nextpnr-xilinx --version || true
      - name: Build Arty A7 (intermediates + bit)
        run: |
          export PATH="/opt/openxc7/bin:$PATH"
          export NEXTPNR_XILINX_DIR=/opt/openxc7
          cd boards/arty-a7
          make          # json + edif
          make bit
          ls -la blinky-arty-a7.*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinky-arty-a7
          path: boards/arty-a7/blinky-arty-a7.*
          if-no-files-found: warn

  arty-s7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Install full openXC7 toolchain (includes Kintex chipdbs)
        run: |
          curl -L -o /tmp/openxc7.tgz https://github.com/cavearr/toolchain-openxc7-releases/releases/download/2026-10-19/openxc7-toolchain-linux-x86-64-20261019.tgz
          sudo mkdir -p /opt/openxc7
          sudo tar xzf /tmp/openxc7.tgz -C /opt/openxc7 --strip-components=1
          echo "/opt/openxc7/bin" >> $GITHUB_PATH
          echo "NEXTPNR_XILINX_DIR=/opt/openxc7" >> $GITHUB_ENV
          ls /opt/openxc7/share/nextpnr/himbaechel/xilinx/ | head -20 || true
          /opt/openxc7/bin/nextpnr-xilinx --version || true
      - name: Build Arty S7 (intermediates + bit)
        run: |
          export PATH="/opt/openxc7/bin:$PATH"
          export NEXTPNR_XILINX_DIR=/opt/openxc7
          cd boards/arty-s7
          make
          make bit
          ls -la blinky-arty-s7.*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinky-arty-s7
          path: boards/arty-s7/blinky-arty-s7.*
          if-no-files-found: warn

  nexys2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Build Nexys 2 (intermediates)
        run: |
          cd boards/nexys2
          make bit
          ls -la blinky-nexys2.*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-nexys2
          path: boards/nexys2/blinky-nexys2.*
          if-no-files-found: warn

  superstation-yosys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Build SuperStation VQM
        run: |
          cd boards/mister
          make bit
          ls -la blinky-superstation.vqm
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-superstation
          path: boards/mister/blinky-superstation.vqm
          if-no-files-found: warn

  superstation-quartus:
    runs-on: ubuntu-latest
    container: raetro/quartus:mister
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - name: Attempt SuperStation / Cyclone V compile (best-effort)
        continue-on-error: true
        run: |
          cd boards/mister || true
          make || true
          quartus_map --version || echo "Quartus image incompatible with current Actions runner (glibc)"
          find . -name "*.sof" -o -name "*.rbf" -o -name "*.vqm" || true
          echo "Full .rbf requires local Quartus or a newer image. Open artifact is blinky-superstation.vqm."
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: blinky-superstation-quartus
          path: boards/mister/**/*.{sof,rbf,rpt,vqm}
          if-no-files-found: warn


  kintex7-qmtech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Install full openXC7 toolchain (includes Kintex chipdbs)
        run: |
          curl -L -o /tmp/openxc7.tgz https://github.com/cavearr/toolchain-openxc7-releases/releases/download/2026-10-19/openxc7-toolchain-linux-x86-64-20261019.tgz
          sudo mkdir -p /opt/openxc7
          sudo tar xzf /tmp/openxc7.tgz -C /opt/openxc7 --strip-components=1
          echo "/opt/openxc7/bin" >> $GITHUB_PATH
          echo "NEXTPNR_XILINX_DIR=/opt/openxc7" >> $GITHUB_ENV
          ls /opt/openxc7/share/nextpnr/himbaechel/xilinx/ | head -20 || true
      - name: Build Kintex-7 QMTech bitstream
        run: |
          cd boards/kintex7-qmtech
          make bit
          ls -la blinky-kintex7-qmtech.bit || ls -la *.bit *.json *.edif
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinky-kintex7-qmtech
          path: boards/kintex7-qmtech/blinky-kintex7-qmtech.*
          if-no-files-found: error

  release:
    needs: [tang-nano, tang-nano-20k, arty-a7, arty-s7, kintex7-qmtech, nexys2, superstation-yosys]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Flatten for clean release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
