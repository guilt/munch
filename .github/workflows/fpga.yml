name: FPGA Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tang-nano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (Yosys + nextpnr + Apicula)
        uses: YosysHQ/setup-oss-cad-suite@v4

      - name: Build Tang Nano 9K bitstream
        run: |
          cd boards/tangnano9k
          make
          ls -la *.fs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tangnano9k-fs
          path: boards/tangnano9k/*.fs
          if-no-files-found: error

  yosys-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4

      - name: Yosys experimental synth (Spartan-3E / others)
        run: |
          # Experimental Yosys targets (no full bitstream without vendor PnR)
          yosys -p "read_verilog src/blinky.v; synth_xilinx -family xc3se -top blinky; write_edif build/nexys2.edif" || true
          yosys -p "read_verilog src/blinky.v; synth_xilinx -family xc7 -top blinky; write_json build/arty_s7.json" || true
          mkdir -p build
          echo "Yosys experimental synthesis attempted for Spartan-3E and Series-7" > build/yosys-notes.txt
          ls -la build/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yosys-experimental
          path: build/
          if-no-files-found: warn

  release:
    needs: [tang-nano]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release with bitstreams
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
